name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::EC2_SSH_KEY secret is not set! Please add your EC2 private key in GitHub repository settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p ~/.ssh

          RAW_KEY="$EC2_SSH_KEY"

          # 1. Expand literal \n if present
          if echo "$RAW_KEY" | grep -q '\\n'; then
            echo "Notice: Detected literal \n in secret, converting to newlines."
            RAW_KEY=$(printf '%b' "$RAW_KEY")
          fi

          # 2. Check if secret is Base64 encoded and decode it
          if ! echo "$RAW_KEY" | grep -q "BEGIN"; then
            echo "Notice: Secret does not contain 'BEGIN'. Attempting Base64 decode..."
            B64_DECODED=$(echo "$RAW_KEY" | tr -d ' \r\n' | base64 -d 2>/dev/null || true)
            if echo "$B64_DECODED" | grep -q "BEGIN"; then
              echo "✅ Successfully decoded Base64 key."
              RAW_KEY="$B64_DECODED"
            fi
          fi

          # 3. Clean carriage returns (\r), outer quotes, and ensure trailing newline
          echo "$RAW_KEY" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" | tr -d '\r' | sed -e '$a\' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 4. Diagnostics check
          KEY_LINES=$(wc -l < ~/.ssh/id_rsa)
          KEY_BYTES=$(wc -c < ~/.ssh/id_rsa)
          echo "Key file size: $KEY_BYTES bytes, $KEY_LINES lines."
          echo "First line: $(head -n 1 ~/.ssh/id_rsa)"
          echo "Last line: $(tail -n 1 ~/.ssh/id_rsa)"

          # 5. Validate key with ssh-keygen
          if ! KEYGEN_OUT=$(ssh-keygen -y -P "" -f ~/.ssh/id_rsa 2>&1); then
            echo "::error::ssh-keygen failed to validate private key:"
            echo "$KEYGEN_OUT"
            exit 1
          fi

          echo "✅ SSH private key successfully loaded and validated."

          # Global SSH config to support all RSA signatures and avoid host key prompt
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostKeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH Connection
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST || '13.127.244.35' }} \
            "echo '✅ Connected successfully to EC2 instance (13.127.244.35)'"

      - name: Synchronize Files to EC2
        run: |
          # Create target directory on EC2 if not present
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST || '13.127.244.35' }} \
            "mkdir -p /home/ubuntu/exam_portal_project"

          # Sync project code using rsync
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/venv' \
            --exclude 'backend/.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'powershell.cmd' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ ${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST || '13.127.244.35' }}:/home/ubuntu/exam_portal_project/

      - name: Execute Deployment on EC2
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST || '13.127.244.35' }} \
            "chmod +x /home/ubuntu/exam_portal_project/scripts/deploy.sh && bash /home/ubuntu/exam_portal_project/scripts/deploy.sh"
